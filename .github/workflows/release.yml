name: release

# Builds UNSIGNED installers for macOS, Windows and Linux when a v* tag is
# pushed, and attaches them to a draft GitHub release. No signing secrets
# are used; see docs/packaging.md for adding signing later.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: npm ci
        working-directory: ui
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: ui/node_modules/.bin/tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: AI Ledger ${{ github.ref_name }}
          releaseBody: Unsigned builds. See docs/packaging.md for install notes.
          releaseDraft: true
          prerelease: false
