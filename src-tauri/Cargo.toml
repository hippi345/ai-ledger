[package]
name = "ai-ledger"
description = "AI Ledger desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ai_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Unit-test harnesses would lack the Windows Common Controls manifest; tests
# live in tests/ instead, where build.rs embeds it.
test = false
doctest = false

[[bin]]
name = "ai-ledger"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"
notify = "8"
ledger-core = { path = "../crates/ledger-core" }
reader-cursor = { path = "../crates/readers/cursor" }
reader-claude-code = { path = "../crates/readers/claude_code" }
reader-csv-import = { path = "../crates/readers/csv_import" }
# Specta v2 is pre-release; pin exact versions as tauri-specta requires.
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
